# Active only when SPRING_PROFILES_ACTIVE=aws (set on the EC2 deployment,
# never for local dev). Fetches DB_PASSWORD and JWT_SECRET from AWS SSM
# Parameter Store at startup instead of from env vars / .env, binding
# directly into the existing ${DB_PASSWORD}/${JWT_SECRET} placeholders
# in application.properties.
spring.config.import=aws-parameterstore:/agrosamridhi/common/
spring.cloud.aws.region.static=ap-south-1
