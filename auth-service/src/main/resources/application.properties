spring.application.name=agro-auth-service
server.port=8081
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3306/agro_auth?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=agro_auth_super_secret_key_minimum_256_bits_long_abc123xyz456
app.jwt.expiration-ms=604800000

management.endpoints.web.exposure.include=health,info

app.cors.allowed-origins=http://localhost:3000,http://localhost:8084