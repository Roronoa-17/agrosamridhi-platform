spring.application.name=agro-auth-service
server.port=8081
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:h2:mem:agrosamridhi_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

app.jwt.secret=${JWT_SECRET:agro_auth_super_secret_key_minimum_256_bits_long_abc123xyz456}
app.jwt.expiration-ms=604800000

management.endpoints.web.exposure.include=health,info

app.cors.allowed-origins=http://localhost:3000,http://localhost:8084