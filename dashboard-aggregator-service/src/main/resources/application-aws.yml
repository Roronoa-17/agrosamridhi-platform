# Active only when SPRING_PROFILES_ACTIVE=aws (set on the EC2 deployment,
# never for local dev). Fetches JWT_SECRET from AWS SSM Parameter Store
# at startup instead of from an env var / .env, binding directly into
# the existing ${JWT_SECRET} placeholder in application.yml.
spring:
  config:
    import: "aws-parameterstore:/agrosamridhi/common/"
  cloud:
    aws:
      region:
        static: ap-south-1
