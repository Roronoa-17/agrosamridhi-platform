server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true

# Route 1: Auth Service
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**, /api/schemes/**

# Route 2: Data Ingestion
spring.cloud.gateway.mvc.routes[1].id=data-ingestion-service
spring.cloud.gateway.mvc.routes[1].uri=${DATA_INGESTION_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/mandi/**, /api/weather/**

# Route 3: AI Inference
spring.cloud.gateway.mvc.routes[2].id=ai-inference-service
spring.cloud.gateway.mvc.routes[2].uri=${AI_INFERENCE_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/ai/**

# Route 4: Dashboard Aggregator
spring.cloud.gateway.mvc.routes[3].id=dashboard-aggregator-service
spring.cloud.gateway.mvc.routes[3].uri=${DASHBOARD_AGGREGATOR_SERVICE_URI:http://localhost:8090}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/dashboard/**

eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.preferIpAddress=true

# No default: fail fast at startup rather than silently signing/validating tokens
# with a secret that's public in source control.
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}