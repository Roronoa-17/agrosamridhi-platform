server.port=8080
spring.application.name=api-gateway

# Enable Eureka client discovery locator for routes
spring.cloud.gateway.discovery.locator.enabled=true

# -------------------------------------------------------------------
# Microservice Routes Configuration
# -------------------------------------------------------------------

# Route 1: Identity & Profiles (auth-service)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /api/schemes/**

# Route 2: External Data Ingestion (data-ingestion-service)
spring.cloud.gateway.routes[1].id=data-ingestion-service
spring.cloud.gateway.routes[1].uri=lb://DATA-INGESTION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/mandi/**, /api/weather/**

# Route 3: Reactive AI & Vision (ai-inference-service)
spring.cloud.gateway.routes[2].id=ai-inference-service
spring.cloud.gateway.routes[2].uri=lb://AI-INFERENCE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/ai/**

# Route 4: API Aggregation Dashboard (dashboard-aggregator-service)
spring.cloud.gateway.routes[3].id=dashboard-aggregator-service
spring.cloud.gateway.routes[3].uri=lb://DASHBOARD-AGGREGATOR-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/dashboard/**

# -------------------------------------------------------------------
# Connect Gateway to the Discovery Registry
# -------------------------------------------------------------------
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.preferIpAddress=true

