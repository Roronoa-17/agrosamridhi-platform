server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true

# Route 1: Auth Service
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**, /api/schemes/**

# Route 2: Data Ingestion
spring.cloud.gateway.mvc.routes[1].id=data-ingestion-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/mandi/**, /api/weather/**

# Route 3: AI Inference
spring.cloud.gateway.mvc.routes[2].id=ai-inference-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8084
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/ai/**

# Route 4: Dashboard Aggregator
spring.cloud.gateway.mvc.routes[3].id=dashboard-aggregator-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8090
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/dashboard/**

eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.preferIpAddress=true

app.jwt.secret=${JWT_SECRET:agro_auth_super_secret_key_minimum_256_bits_long_abc123xyz456}