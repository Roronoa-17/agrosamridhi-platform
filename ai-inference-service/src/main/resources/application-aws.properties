# Active only when SPRING_PROFILES_ACTIVE=aws (set on the EC2 deployment,
# never for local dev). Fetches GEMINI_API_KEY from AWS SSM Parameter
# Store at startup instead of from an env var / .env, binding directly
# into the existing ${GEMINI_API_KEY} placeholder in application.yml.
spring.config.import=aws-parameterstore:/agrosamridhi/ai-inference-service/
spring.cloud.aws.region.static=ap-south-1
