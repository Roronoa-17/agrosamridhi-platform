# Active only when SPRING_PROFILES_ACTIVE=aws (set on the EC2 deployment,
# never for local dev). Fetches DB_PASSWORD and (optionally)
# AGMARKNET_API_KEY from AWS SSM Parameter Store at startup instead of
# from env vars / .env, binding directly into the existing
# ${DB_PASSWORD}/${AGMARKNET_API_KEY} placeholders in application.properties.
# AGMARKNET_API_KEY is optional: the service already falls back to a
# public shared key, so a missing per-service parameter path isn't fatal.
spring.config.import=aws-parameterstore:/agrosamridhi/common/,optional:aws-parameterstore:/agrosamridhi/data-ingestion-service/
spring.cloud.aws.region.static=ap-south-1
