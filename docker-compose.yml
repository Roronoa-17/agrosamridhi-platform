services:
  # 1. Global MySQL Database
  agrosamridhi-db:
    image: mysql:8.0
    container_name: agrosamridhi-db
    restart: always
    # No host port published - only reachable from other containers on the
    # compose network. Use `docker compose exec agrosamridhi-db mysql ...` for
    # direct access instead of binding 3306/3307 on the host.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: agrosamridhi_db
    volumes:
      - db_data:/var/lib/mysql
    # Healthcheck ensures dependent services wait until MySQL is fully ready
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Global Redis Cache (For Module 8 Dashboard & Rate Limiting)
  agrosamridhi-cache:
    image: redis:7-alpine
    container_name: agrosamridhi-cache
    restart: always
    # No host port published - internal only.

  # 3. Eureka Service Discovery
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    restart: always
    # No host port published - the Eureka dashboard is only reachable from
    # inside the compose network (`docker compose exec` or a temporary port
    # forward if you need to inspect it).
    environment:
      EUREKA_HOSTNAME: discovery-server

  # 4. Auth Service
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: always
    # No host port published - reached only via api-gateway.
    depends_on:
      agrosamridhi-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      DB_HOST: agrosamridhi-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      EUREKA_URI: http://discovery-server:8761/eureka/
      # Required - no default. JWT_SECRET must be set in .env or the
      # container fails to start rather than silently signing tokens with a
      # publicly-known secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

  # 5. Data Ingestion Service (weather + mandi price data)
  data-ingestion-service:
    build:
      context: .
      dockerfile: data-ingestion-service/Dockerfile
    container_name: data-ingestion-service
    restart: always
    # No host port published - reached only via api-gateway.
    depends_on:
      agrosamridhi-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      DB_HOST: agrosamridhi-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      EUREKA_URI: http://discovery-server:8761/eureka/
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-579b464db66ec23bdd0000012f6f17254eb24f0c4822fae0e3ab56ed}

  # 6. AI Inference Service (Gemini-backed)
  ai-inference-service:
    build:
      context: ./ai-inference-service
    container_name: ai-inference-service
    restart: always
    # No host port published - reached only via api-gateway.
    depends_on:
      discovery-server:
        condition: service_started
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      GEMINI_API_KEY: ${GEMINI_API_KEY}

  # 7. Dashboard Aggregator Service
  dashboard-aggregator-service:
    build:
      context: ./dashboard-aggregator-service
    container_name: dashboard-aggregator-service
    restart: always
    # No host port published - reached only via api-gateway.
    depends_on:
      discovery-server:
        condition: service_started
      agrosamridhi-cache:
        condition: service_started
    environment:
      REDIS_HOST: agrosamridhi-cache
      REDIS_PORT: 6379
      EUREKA_URI: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

  # 8. API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_started
      auth-service:
        condition: service_started
      data-ingestion-service:
        condition: service_started
      ai-inference-service:
        condition: service_started
      dashboard-aggregator-service:
        condition: service_started
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      AUTH_SERVICE_URI: http://auth-service:8081
      DATA_INGESTION_SERVICE_URI: http://data-ingestion-service:8083
      AI_INFERENCE_SERVICE_URI: http://ai-inference-service:8084
      DASHBOARD_AGGREGATOR_SERVICE_URI: http://dashboard-aggregator-service:8090
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

  # 9. Frontend (React/Vite, served via nginx)
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  # Persists database data even if the container is destroyed
  db_data:
